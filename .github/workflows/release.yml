name: Publicação

on:
  push:
    tags: ['v*']
  # Mudanças de empacotamento geram os pacotes no PR, sem publicar.
  pull_request:
    paths:
      - .github/workflows/release.yml
      - .github/release-notes.md
      - package.json
      - package-lock.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Pacotes Windows
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Obter o código
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Preparar Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Instalar dependências sem executar scripts
        run: npm ci --ignore-scripts
      - name: Conferir a versão da tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ("v$version" -ne $env:GITHUB_REF_NAME) { throw "A tag $env:GITHUB_REF_NAME não corresponde à versão $version do package.json." }
      - name: Verificar código e catálogo
        run: npm run check
      - name: Executar testes
        run: npm test
      - name: Gerar instalador, portátil e ZIP
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          # The portable unpacks into a predictable %TEMP%\Neo-<version> folder that IT can allow; versions never share it.
          npm run build -- --publish never "-c.portable.unpackDirName=Neo-$version"
      - name: Empacotar código e somas SHA-256
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          git archive --format=zip --output "release/Neo-$version-codigo.zip" HEAD
          $files = "Neo-$version-x64-nsis.exe", "Neo-$version-x64-portable.exe", "Neo-$version-x64.zip", "Neo-$version-codigo.zip" | ForEach-Object { Join-Path release $_ }
          Get-FileHash -Algorithm SHA256 -LiteralPath $files | ForEach-Object { '{0}  {1}' -f $_.Hash.ToLower(), (Split-Path $_.Path -Leaf) } | Set-Content release/SHA256SUMS.txt -Encoding ascii
          Get-Content release/SHA256SUMS.txt
      - name: Preparar as notas da versão
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          # A seção da versão no CHANGELOG e os hashes do SHA256SUMS.txt preenchem o modelo; numa tag, a seção é obrigatória.
          $sums = @{}
          foreach ($line in Get-Content release/SHA256SUMS.txt) { $hash, $name = $line -split '\s+', 2; $sums[$name] = $hash }
          foreach ($file in "Neo-$version-x64-portable.exe", "Neo-$version-x64-nsis.exe", "Neo-$version-x64.zip") { if (-not $sums[$file]) { throw "O SHA256SUMS.txt não tem o hash de $file." } }
          $section = (Get-Content CHANGELOG.md -Raw -Encoding utf8) -split '(?m)^## ' | Where-Object { $_ -match "^$([regex]::Escape($version))\s" } | Select-Object -First 1
          if (-not $section -and $env:GITHUB_REF -like 'refs/tags/*') { throw "O CHANGELOG.md não tem a seção $version." }
          $changes = if ($section) { ($section -split "`n", 2)[1].Trim() } else { '- Consulte o [histórico de versões](https://github.com/llypeDev/NEO/blob/main/CHANGELOG.md).' }
          $notes = (Get-Content .github/release-notes.md -Raw -Encoding utf8).Replace('{{version}}', $version).Replace('{{changes}}', $changes).Replace('{{sha256-portable}}', $sums["Neo-$version-x64-portable.exe"]).Replace('{{sha256-nsis}}', $sums["Neo-$version-x64-nsis.exe"]).Replace('{{sha256-zip}}', $sums["Neo-$version-x64.zip"]).Trim()
          if ($notes -match '\{\{') { throw 'O modelo das notas tem um campo sem valor.' }
          Set-Content -LiteralPath "$env:RUNNER_TEMP\notas.md" -Value $notes -Encoding utf8
          Get-Content -LiteralPath "$env:RUNNER_TEMP\notas.md"
      - name: Guardar os pacotes
        uses: actions/upload-artifact@v7.0.1
        with:
          name: neo-windows
          path: |
            release/*.exe
            release/Neo-*-x64.zip
            release/*-codigo.zip
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
      - name: Criar rascunho da versão
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          # O rascunho só é publicado manualmente, depois de revisado.
          $assets = "Neo-$version-x64-nsis.exe", "Neo-$version-x64-portable.exe", "Neo-$version-x64.zip", "Neo-$version-codigo.zip", "SHA256SUMS.txt" | ForEach-Object { Join-Path release $_ }
          gh release create $env:GITHUB_REF_NAME @assets --draft --title "Neo $version" --notes-file "$env:RUNNER_TEMP\notas.md"
