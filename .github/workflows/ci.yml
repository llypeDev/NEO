name: Verificação

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Testes e sintaxe no Windows
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Obter o código
        uses: actions/checkout@v7.0.1
      - name: Preparar Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Instalar dependências sem executar scripts
        run: npm ci --ignore-scripts
      - name: Verificar código e catálogo
        run: npm run check
      - name: Executar testes
        run: npm test
